<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#3B82F6" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  
  <!-- Inner Blue Shield Emblem -->
  <path d="M256 96 L376 152 V264 C376 340 256 416 256 416 C256 416 136 340 136 264 V152 Z" 
        fill="url(#blueGrad)" 
        filter="url(#glow)" />
        
  <!-- White Monogram 'I.' -->
  <text x="238" y="292" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="140" 
        font-weight="900" 
        fill="#F5F7FA" 
        text-anchor="middle">I</text>
        
  <circle cx="304" cy="286" r="14" fill="#F5F7FA" />
</svg>
