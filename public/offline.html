<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Hasnain Al Ifan Portfolio Manager</title>
    <style>
        :root {
            --bg-navy: #0B1120;
            --text-white: #F5F7FA;
            --text-muted: #94A3B8;
            --electric-blue: #3B82F6;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-navy);
            color: var(--text-white);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .offline-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 28px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
        }
        .offline-icon {
            width: 64px;
            height: 64px;
            color: var(--electric-blue);
            margin: 0 auto 20px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }
        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 28px;
        }
        .btn-retry {
            display: inline-block;
            background: var(--electric-blue);
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }
        .btn-retry:hover {
            background: #2563EB;
            transform: translateY(-1px);
        }
        .brand-sub {
            margin-top: 24px;
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <svg class="offline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 1l22 22"></path>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
            <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
        <h1>Internet Connection Lost</h1>
        <p>You appear to be offline. The management platform requires an active network connection to safeguard real-time data and security.</p>
        <button class="btn-retry" onclick="window.location.reload()">Retry Connection</button>
        <div class="brand-sub">Hasnain Al Ifan &middot; Portfolio Platform PWA</div>
    </div>
</body>
</html>
