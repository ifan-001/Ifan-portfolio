server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/portfolio/public;
    index index.php;
    charset utf-8;

    # CV, photos and screenshots are uploaded from the admin panel
    client_max_body_size 25m;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Never serve dot files (.env, .git ...) except Let's Encrypt challenges
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Service worker + manifest must always be fresh
    location = /sw.js {
        add_header Cache-Control "no-cache, max-age=0";
        try_files $uri /index.php?$query_string;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, max-age=0";
        try_files $uri /index.php?$query_string;
    }

    # CSS / JS are versioned with ?v=<mtime>, images get a unique file name when replaced
    location ~* \.(?:css|js|woff2?|ttf|ico|svg|png|jpe?g|webp|gif|avif|pdf)$ {
        try_files $uri /index.php?$query_string;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Only index.php may run, never an uploaded file
    location ~ ^/(?:images|uploads|resume)/.*\.php$ {
        deny all;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php__PHPV__-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.ht {
        deny all;
    }
}
